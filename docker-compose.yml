services:
  mariadb:
    image: mariadb:10.11
    ports:
      - '${FORWARD_DB_PORT:-3306}:3306'
    volumes:
      - mariadb_data:/var/lib/mysql
    environment:
      MYSQL_DATABASE: ${DB_DATABASE:-mail}
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD:-password}
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 5

  app:
    build:
      context: .
      dockerfile: docker/app/Dockerfile
    depends_on:
      mariadb:
        condition: service_healthy
    tmpfs:
      - /var/www/html/storage/framework/cache:uid=33,gid=33
      - /var/www/html/storage/framework/sessions:uid=33,gid=33
      - /var/www/html/storage/framework/views:uid=33,gid=33
      - /var/www/html/bootstrap/cache:uid=33,gid=33
    environment:
      DB_CONNECTION: mysql
      DB_HOST: mariadb
      DB_PORT: 3306
      DB_DATABASE: ${DB_DATABASE}
      DB_USERNAME: ${DB_USERNAME}
      DB_PASSWORD: ${DB_PASSWORD}
      APP_KEY: ${APP_KEY}
      APP_ENV: ${APP_ENV:-local}
      APP_DEBUG: ${APP_DEBUG:-true}
      APP_URL: http://mail.loc
      # SANCTUM_STATEFUL_DOMAINS: Disabled for token-based authentication (no stateful domains needed)
      SANCTUM_STATEFUL_DOMAINS: ""
      SESSION_SECURE_COOKIE: false
      CORS_ALLOWED_ORIGINS: http://localhost:5173
      OFFICE365_TENANT_ID: ${OFFICE365_TENANT_ID}
      OFFICE365_CLIENT_ID: ${OFFICE365_CLIENT_ID}
      OFFICE365_CLIENT_SECRET: ${OFFICE365_CLIENT_SECRET}
      OFFICE365_REDIRECT_URI: ${OFFICE365_REDIRECT_URI}
      OFFICE365_SCOPES: ${OFFICE365_SCOPES}
      WEBHOOK_BASE_URL: ${WEBHOOK_BASE_URL}
      WEBHOOK_SECRET_KEY: ${WEBHOOK_SECRET_KEY}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY}
    labels:
      - traefik.enable=true
      - traefik.http.routers.mail-local.rule=Host(`mail.loc`)
      - traefik.http.services.mail-local.loadbalancer.server.port=80
    networks:
      - default
      - proxy

  queue:
    build:
      context: .
      dockerfile: docker/app/Dockerfile
    depends_on:
      mariadb:
        condition: service_healthy
      app:
        condition: service_started
    tmpfs:
      - /var/www/html/storage/framework/cache:uid=33,gid=33
      - /var/www/html/storage/framework/sessions:uid=33,gid=33
      - /var/www/html/storage/framework/views:uid=33,gid=33
      - /var/www/html/bootstrap/cache:uid=33,gid=33
    environment:
      DB_CONNECTION: mysql
      DB_HOST: mariadb
      DB_PORT: 3306
      DB_DATABASE: ${DB_DATABASE}
      DB_USERNAME: ${DB_USERNAME}
      DB_PASSWORD: ${DB_PASSWORD}
      APP_KEY: ${APP_KEY}
      APP_ENV: ${APP_ENV:-local}
      APP_DEBUG: ${APP_DEBUG:-true}
      APP_URL: http://mail.loc
      SANCTUM_STATEFUL_DOMAINS: ""
      SESSION_SECURE_COOKIE: false
      CORS_ALLOWED_ORIGINS: http://localhost:5173
      OFFICE365_TENANT_ID: ${OFFICE365_TENANT_ID}
      OFFICE365_CLIENT_ID: ${OFFICE365_CLIENT_ID}
      OFFICE365_CLIENT_SECRET: ${OFFICE365_CLIENT_SECRET}
      OFFICE365_REDIRECT_URI: ${OFFICE365_REDIRECT_URI}
      OFFICE365_SCOPES: ${OFFICE365_SCOPES}
      WEBHOOK_BASE_URL: ${WEBHOOK_BASE_URL}
      WEBHOOK_SECRET_KEY: ${WEBHOOK_SECRET_KEY}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY}
    command: php artisan queue:listen --timeout=600 --memory=512 --sleep=3 --tries=3
    restart: unless-stopped
    networks:
      - default

volumes:
  mariadb_data:
    driver: local

networks:
  default:
    driver: bridge
  proxy:
    external: true

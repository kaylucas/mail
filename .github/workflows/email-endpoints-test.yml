name: Email Endpoints Test

on:
  push:
    branches: [ main, develop, 'claude/*' ]
    paths:
      - 'app/Http/Controllers/EmailController.php'
      - 'app/Models/Email.php'
      - 'app/Models/EmailFolder.php'
      - 'app/Models/EmailAttachment.php'
      - 'routes/api.php'
      - 'tests/Feature/EmailControllerTest.php'
      - 'database/migrations/*email*.php'
  pull_request:
    branches: [ main, develop ]
    paths:
      - 'app/Http/Controllers/EmailController.php'
      - 'app/Models/Email.php'
      - 'app/Models/EmailFolder.php'
      - 'app/Models/EmailAttachment.php'
      - 'routes/api.php'
      - 'tests/Feature/EmailControllerTest.php'
      - 'database/migrations/*email*.php'
  workflow_dispatch:
  schedule:
    # Run tests every day at 2 AM UTC
    - cron: '0 2 * * *'

jobs:
  test-email-endpoints:
    runs-on: ubuntu-latest

    services:
      mysql:
        image: mariadb:10.11
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: mail_test
          MYSQL_USER: mail
          MYSQL_PASSWORD: secret
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping --silent"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=3

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: 8.2
          extensions: dom, curl, libxml, mbstring, zip, pcntl, pdo, sqlite, pdo_mysql, bcmath, soap, intl, gd, exif, iconv
          coverage: none

      - name: Install pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 8

      - name: Get Composer cache directory
        id: composer-cache
        run: echo "dir=$(composer config cache-files-dir)" >> $GITHUB_OUTPUT

      - name: Cache Composer dependencies
        uses: actions/cache@v4
        with:
          path: ${{ steps.composer-cache.outputs.dir }}
          key: ${{ runner.os }}-composer-${{ hashFiles('**/composer.lock') }}
          restore-keys: ${{ runner.os }}-composer-

      - name: Install Composer dependencies
        run: composer install --prefer-dist --no-interaction --no-progress --optimize-autoloader

      - name: Copy .env.testing
        run: |
          cp .env.example .env.testing
          echo "DB_CONNECTION=mysql" >> .env.testing
          echo "DB_HOST=127.0.0.1" >> .env.testing
          echo "DB_PORT=3306" >> .env.testing
          echo "DB_DATABASE=mail_test" >> .env.testing
          echo "DB_USERNAME=mail" >> .env.testing
          echo "DB_PASSWORD=secret" >> .env.testing

      - name: Generate application key
        run: php artisan key:generate --env=testing

      - name: Wait for MySQL
        run: |
          until mysqladmin ping -h 127.0.0.1 -u mail -psecret --silent; do
            echo 'Waiting for MySQL...'
            sleep 2
          done

      - name: Run migrations
        run: php artisan migrate --env=testing --force

      - name: Run Email Endpoint Tests
        run: php artisan test --filter=EmailControllerTest --env=testing

      - name: Upload test results
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: storage/logs/

  test-coverage:
    runs-on: ubuntu-latest
    needs: test-email-endpoints

    services:
      mysql:
        image: mariadb:10.11
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: mail_test
          MYSQL_USER: mail
          MYSQL_PASSWORD: secret
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping --silent"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=3

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup PHP with Xdebug
        uses: shivammathur/setup-php@v2
        with:
          php-version: 8.2
          extensions: dom, curl, libxml, mbstring, zip, pcntl, pdo, sqlite, pdo_mysql, bcmath, soap, intl, gd, exif, iconv
          coverage: xdebug

      - name: Install Composer dependencies
        run: composer install --prefer-dist --no-interaction --no-progress

      - name: Prepare environment
        run: |
          cp .env.example .env.testing
          echo "DB_CONNECTION=mysql" >> .env.testing
          echo "DB_HOST=127.0.0.1" >> .env.testing
          echo "DB_PORT=3306" >> .env.testing
          echo "DB_DATABASE=mail_test" >> .env.testing
          echo "DB_USERNAME=mail" >> .env.testing
          echo "DB_PASSWORD=secret" >> .env.testing
          php artisan key:generate --env=testing

      - name: Wait for MySQL
        run: |
          until mysqladmin ping -h 127.0.0.1 -u mail -psecret --silent; do
            echo 'Waiting for MySQL...'
            sleep 2
          done

      - name: Run migrations
        run: php artisan migrate --env=testing --force

      - name: Run tests with coverage
        run: php artisan test --filter=EmailControllerTest --env=testing --coverage --min=80

      - name: Upload coverage reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage/
